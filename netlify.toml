[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/redgifs"
  to = "/.netlify/functions/redgifs"
  status = 200
  force = true

[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200
  force = true

[[redirects]]
  from = "/api/premium"
  to = "/.netlify/functions/premium"
  status = 200
  force = true

[[redirects]]
  from = "/api/telegram"
  to = "/.netlify/functions/telegram"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
