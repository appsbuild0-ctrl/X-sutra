[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/redgifs"
  to = "/.netlify/functions/redgifs"
  status = 200
  force = true

[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200
  force = true

[[redirects]]
  from = "/api/premium"
  to = "/.netlify/functions/premium"
  status = 200
  force = true

[[redirects]]
  from = "/api/premium-scan"
  to = "/.netlify/functions/premium-scan"
  status = 200
  force = true

[[redirects]]
  from = "/api/premium-file"
  to = "/.netlify/functions/premium-file"
  status = 200
  force = true

[[redirects]]
  from = "/api/telegram/channels"
  to = "/.netlify/functions/telegram-channels"
  status = 200
  force = true

# Owner bootstrap only. The function requires the x-admin-setup-secret header
# (timing-safe compared against ADMIN_SETUP_SECRET). Used by the owner-only
# Telegram tab in the admin panel and by trusted terminals.
[[redirects]]
  from = "/api/internal/telegram-auth"
  to = "/.netlify/functions/telegram-admin"
  status = 200
  force = true

# "Login with Telegram" (Telegram Login Widget verification + X-Sutra JWT).
[[redirects]]
  from = "/api/auth/telegram"
  to = "/.netlify/functions/auth-telegram"
  status = 200
  force = true

# Admin uploads (exact path first, then the file endpoint below it).
[[redirects]]
  from = "/api/uploads"
  to = "/.netlify/functions/uploads"
  status = 200
  force = true

[[redirects]]
  from = "/api/uploads/*"
  to = "/.netlify/functions/upload-file?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/hotpic"
  to = "/.netlify/functions/hotpic"
  status = 200
  force = true

[[redirects]]
  from = "/api/hotpic-html/*"
  to = "https://hotpic.vip/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
